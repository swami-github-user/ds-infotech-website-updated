AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: DS Infotech Serverless Backend

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Architectures:
      - x86_64

Resources:

  #########################################################
  # DynamoDB Table
  #########################################################
    #########################################################
  # HTTP API
  #########################################################

  HttpApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:3000"
          - "http://dsinfotech.com.s3-website-ap-south-1.amazonaws.com"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  ContactRequestsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName: ds-infotech-contact-requests

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S

      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

#########################################################
# Lambda Function
#########################################################

  ContactFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: ds-infotech-contact

      Handler: src/handlers/contact.handler

      CodeUri: .

      Environment:
        Variables:
          CONTACT_TABLE: ds-infotech-contact-requests

      Policies:
        - DynamoDBCrudPolicy:
            TableName: ds-infotech-contact-requests
        
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

      Events:

        ContactApi:

          Type: HttpApi

          Properties:
          
            ApiId: !Ref HttpApi

            Path: /contact

            Method: POST

Outputs:

  ContactApi:

    Description: Contact API Endpoint

    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/contact"